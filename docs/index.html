<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>命理引擎 · BaZi + Zi Wei Dou Shu</title>
<style>
:root{
  --bg:#111216; --bg2:#0c0d10; --panel:#191b21; --panel2:#20232b; --line:#2b2f38;
  --tx:#e9e6df; --tx2:#a4a3a0; --tx3:#71716e;
  --amber:#e8a33d; --amber2:#f3c26b; --teal:#5dcaa5; --red:#e2635f;
  --blue:#6aa9e0; --purple:#a99ce8; --pink:#dd8fb0;
  --serif:"Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, #1d2028 0%, transparent 60%),
    radial-gradient(900px 500px at 95% 0%, #1a1c22 0%, transparent 55%),
    var(--bg);
  color:var(--tx);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  min-height:100vh;
}
a{color:var(--amber);text-decoration:none}
.mono{font-variant-numeric:tabular-nums}
header.top{
  position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:rgba(12,13,16,.82);border-bottom:1px solid var(--line);
}
.top .in{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--serif);font-size:19px;letter-spacing:.14em;color:var(--amber2)}
.brand span{font-size:11px;color:var(--tx3);letter-spacing:.2em;text-transform:uppercase}
.spacer{flex:1}
.btn{
  border:1px solid var(--line);background:var(--panel);color:var(--tx2);
  padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;transition:.16s;
}
.btn:hover{border-color:var(--amber);color:var(--amber2)}
.btn.primary{background:linear-gradient(180deg,#f0b455,#dd9330);color:#20180a;border:none;font-weight:600}
.btn.primary:hover{filter:brightness(1.08);color:#20180a}
.btn.ghost{background:transparent}
main{max-width:1280px;margin:0 auto;padding:22px 20px 80px}

/* ---------- input ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.form{padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;color:var(--tx3);letter-spacing:.08em}
.field input,.field select{
  background:var(--bg2);border:1px solid var(--line);color:var(--tx);
  padding:8px 10px;border-radius:8px;font-size:14px;font-family:inherit;width:100%
}
.field input:focus,.field select:focus{outline:none;border-color:var(--amber)}
.form-actions{display:flex;align-items:flex-end;gap:8px}
.toggles{display:flex;flex-wrap:wrap;gap:14px;padding:0 18px 16px;font-size:12.5px;color:var(--tx2)}
.toggles label{display:flex;align-items:center;gap:6px;cursor:pointer}
.toggles input{accent-color:var(--amber)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;margin:22px 0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:9px 15px;color:var(--tx3);cursor:pointer;border-bottom:2px solid transparent;font-size:13.5px;white-space:nowrap}
.tab.on{color:var(--amber2);border-bottom-color:var(--amber)}
.tab:hover{color:var(--tx)}
.view{display:none}
.view.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- pillars ---------- */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pillar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;position:relative;overflow:hidden}
.pillar .pos{font-size:11px;color:var(--tx3);letter-spacing:.12em}
.pillar .gz{font-family:var(--serif);font-size:34px;line-height:1.25;margin:6px 0 2px;letter-spacing:.06em}
.pillar .gz .g{color:var(--amber2)}
.pillar .gz .z{color:var(--tx)}
.pillar.day{border-color:#3d3421;box-shadow:inset 0 0 40px rgba(232,163,61,.07)}
.pillar .sub{font-size:11.5px;color:var(--tx2);line-height:1.9}
.pillar .tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:20px;background:var(--panel2);color:var(--tx3);margin:1px}
.wx-木{color:#7fc98a}.wx-火{color:#e2635f}.wx-土{color:#d3b06a}.wx-金{color:#cfd4dc}.wx-水{color:#6aa9e0}

/* ---------- ziwei board ---------- */
.board{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,minmax(126px,auto));gap:6px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 9px;position:relative;min-height:126px;font-size:12px}
.cell .bh{position:absolute;right:8px;bottom:4px;font-family:var(--serif);font-size:22px;color:#3a3f49}
.cell .ph{font-size:11.5px;color:var(--amber);letter-spacing:.06em}
.cell .ph small{color:var(--tx3);letter-spacing:0}
.cell .st{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.star{font-size:12px;padding:0 4px;border-radius:4px;background:var(--panel2);color:var(--tx2)}
.star.major{color:var(--tx);font-weight:600;background:#262a33}
.star.lucky{color:var(--teal)}
.star.bad{color:var(--red)}
.star .b{font-size:9.5px;color:var(--tx3);margin-left:1px}
.hua{font-size:9.5px;padding:0 3px;border-radius:3px;margin-left:2px;font-weight:700}
.hua禄{background:#2c4a3c;color:#8fe0bb}.hua权{background:#3a3320;color:#f3c26b}
.hua科{background:#26364a;color:#8fc0e8}.hua忌{background:#4a2a2a;color:#f09b98}
.center{grid-column:2 / span 2;grid-row:2 / span 2;background:linear-gradient(160deg,#1b1e25,#15171c);
  border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.center h3{margin:0;font-family:var(--serif);font-size:17px;color:var(--amber2);letter-spacing:.1em;font-weight:500}
.center .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tx2);border-bottom:1px dashed #262a32;padding:3px 0}
.center .row b{color:var(--tx);font-weight:500}

/* ---------- score ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h4{margin:0 0 8px;font-size:12px;color:var(--tx3);font-weight:500;letter-spacing:.1em}
.big{font-family:var(--serif);font-size:40px;line-height:1;color:var(--amber2)}
.big small{font-size:14px;color:var(--tx3);margin-left:4px;font-family:inherit}
.bar{height:7px;background:#23262e;border-radius:6px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;border-radius:6px}
.dimrow{display:flex;align-items:center;gap:10px;font-size:12.5px;margin:7px 0}
.dimrow .nm{width:88px;color:var(--tx2);flex:none}
.dimrow .bar{flex:1;margin:0}
.dimrow .vl{width:38px;text-align:right;color:var(--tx);font-variant-numeric:tabular-nums}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid #23262e}
th{color:var(--tx3);font-weight:500;font-size:11.5px;letter-spacing:.06em}
tbody tr:hover{background:#1d2027}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.5px}
.p-hi{background:#25402f;color:#84dcae}.p-mid{background:#3a3320;color:#ecc47e}.p-low{background:#42272a;color:#ef9d99}
.legend{font-size:11.5px;color:var(--tx3);margin-top:10px}

/* ---------- misc ---------- */
.note{font-size:12.5px;color:var(--tx3);line-height:1.75}
h2.sec{font-family:var(--serif);font-size:16px;letter-spacing:.12em;color:var(--amber2);font-weight:500;margin:26px 0 12px;
  display:flex;align-items:center;gap:10px}
h2.sec:before{content:"";width:3px;height:14px;background:var(--amber);border-radius:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ev-row{display:grid;grid-template-columns:86px 116px 1fr 168px 34px;gap:8px;align-items:center;margin-bottom:8px}
.ev-row input,.ev-row select{background:var(--bg2);border:1px solid var(--line);color:var(--tx);padding:6px 8px;border-radius:7px;font-size:13px;width:100%;font-family:inherit}
.ev-row input[type=range]{padding:0}
.del{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:16px}
.del:hover{color:var(--red)}
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--tx3)}
.kv dd{margin:0;color:var(--tx)}
ul.tight{margin:6px 0;padding-left:18px;font-size:13px;color:var(--tx2)}
ul.tight li{margin:3px 0}
.foot{max-width:1280px;margin:0 auto;padding:0 20px 60px;font-size:11.5px;color:#5b5b58;line-height:1.8}
@media(max-width:820px){
  .two{grid-template-columns:1fr}
  .board{grid-template-rows:repeat(4,minmax(112px,auto))}
  .ev-row{grid-template-columns:1fr 1fr;}
  .pillar .gz{font-size:26px}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><b>命理引擎</b><span>BaZi × Zi Wei</span></div>
  <div class="spacer"></div>
  <a class="btn ghost" href="https://github.com/WEIWEI0614/bazi-ziwei" target="_blank" rel="noopener">GitHub</a>
  <button class="btn" id="langBtn">EN</button>
</div></header>

<main>
  <div class="panel">
    <div class="form">
      <div class="field"><label id="l-name">姓名 / Name</label><input id="f-name" placeholder="—"></div>
      <div class="field"><label id="l-gender">性别 / Gender</label>
        <select id="f-gender"><option value="male">男 / Male</option><option value="female">女 / Female</option></select></div>
      <div class="field"><label id="l-date">公历生日 / Date</label><input id="f-date" type="date" value="1993-06-14"></div>
      <div class="field"><label id="l-time">出生时间 / Time</label><input id="f-time" type="time" value="17:31"></div>
      <div class="field"><label id="l-lon">出生地经度 / Longitude</label>
        <select id="f-city">
          <option value="116.40">北京 Beijing 116.40</option>
          <option value="121.47">上海 Shanghai 121.47</option>
          <option value="113.26">广州 Guangzhou 113.26</option>
          <option value="114.06">深圳 Shenzhen 114.06</option>
          <option value="104.07">成都 Chengdu 104.07</option>
          <option value="108.95">西安 Xi'an 108.95</option>
          <option value="126.53">哈尔滨 Harbin 126.53</option>
          <option value="87.62">乌鲁木齐 Urumqi 87.62</option>
          <option value="103.82">香港 Hong Kong 114.17</option>
          <option value="121.52">台北 Taipei 121.52</option>
          <option value="103.85">新加坡 Singapore 103.85</option>
          <option value="custom">自定义 Custom…</option>
        </select></div>
      <div class="field"><label id="l-customlon">经度值 / Longitude°</label><input id="f-lon" type="number" step="0.01" value="116.40"></div>
      <div class="field form-actions"><button class="btn primary" id="go" style="width:100%">排盘 · Cast</button></div>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="f-truesolar" checked> <span id="l-ts">真太阳时</span></label>
      <label><input type="checkbox" id="f-zistart" checked> <span id="l-zs">子初换日 (23:00)</span></label>
      <label><input type="checkbox" id="f-feixing"> <span id="l-fx">飞星派四化</span></label>
      <label><input type="checkbox" id="f-leapsplit" checked> <span id="l-lp">闰月分半</span></label>
      <label><span id="l-fy">流年焦点</span> <input id="f-focus" type="number" value="2026" style="width:74px;background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:2px 6px"></label>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <!-- 1. chart -->
  <section class="view on" id="v-chart">
    <h2 class="sec" id="h-bazi">四柱八字</h2>
    <div class="grid4" id="pillars"></div>
    <h2 class="sec" id="h-zw">紫微斗数命盘</h2>
    <div class="board" id="board"></div>
    <p class="note" id="zwNote" style="margin-top:10px"></p>
  </section>

  <!-- 2. scores -->
  <section class="view" id="v-score">
    <div class="cards" style="grid-template-columns:minmax(240px,1fr) minmax(300px,1.6fr)">
      <div class="card">
        <h4 id="h-overall">综合格局</h4>
        <div><span class="big" id="overall">—</span><small id="tier"></small></div>
        <div class="note" id="tierNote" style="margin-top:8px"></div>
      </div>
      <div class="card"><h4 id="h-radar">六维 / 六域</h4><svg id="radar" viewBox="0 0 320 300" style="width:100%;max-width:420px"></svg></div>
    </div>
    <h2 class="sec" id="h-dims">评分拆解</h2>
    <div class="card" id="dims"></div>
    <h2 class="sec" id="h-areas">六领域</h2>
    <div class="card" id="areas"></div>
    <h2 class="sec" id="h-read">命局解读</h2>
    <div class="two">
      <div class="card"><h4 id="h-bzread">八字</h4><dl class="kv" id="bzread"></dl></div>
      <div class="card"><h4 id="h-zwread">紫微</h4><dl class="kv" id="zwread"></dl></div>
    </div>
    <h2 class="sec" id="h-school">流派视角</h2>
    <div class="card" id="schoolbox"></div>
    <h2 class="sec" id="h-ss">神煞与刑冲合害</h2>
    <div class="card" id="ssbox"></div>
  </section>

  <!-- 3. years -->
  <section class="view" id="v-year">
    <h2 class="sec" id="h-luck">大运</h2>
    <div class="card" style="overflow-x:auto"><table id="cycTable"></table></div>
    <h2 class="sec" id="h-timeline">流年走势</h2>
    <div class="card"><svg id="yearChart" viewBox="0 0 900 220" style="width:100%"></svg></div>
    <div class="card" style="overflow-x:auto;margin-top:12px"><table id="yearTable"></table></div>
  </section>

  <!-- 4. months -->
  <section class="view" id="v-month">
    <h2 class="sec" id="h-month">流月</h2>
    <div class="card"><svg id="monthChart" viewBox="0 0 900 200" style="width:100%"></svg></div>
    <div class="card" style="overflow-x:auto;margin-top:12px"><table id="monthTable"></table></div>
  </section>

  <!-- 5. events -->
  <section class="view" id="v-event">
    <h2 class="sec" id="h-event">经历对照</h2>
    <p class="note" id="evHint" style="margin:0 0 12px"></p>
    <div class="card">
      <div class="ev-row" style="font-size:11px;color:var(--tx3)" id="evHead"></div>
      <div id="evList"></div>
      <button class="btn" id="addEv" style="margin-top:6px">+ 添加事件</button>
      <button class="btn primary" id="runEv" style="margin-top:6px">开始对照 · Calibrate</button>
    </div>
    <div id="evOut"></div>
  </section>

  <!-- 6. method -->
  <section class="view" id="v-method">
    <h2 class="sec" id="h-method">方法与校验</h2>
    <div class="card" id="methodBox"></div>
  </section>
</main>

<footer class="foot" id="foot"></footer>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
