<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>命理引擎 · BaZi + Zi Wei Dou Shu</title>
<style>
:root{
  --bg:#0f1014; --bg2:#0a0b0e; --panel:#171921; --panel2:#1e2129; --line:#282c36;
  --line2:#333845; --tx:#e9e6df; --tx2:#a4a3a0; --tx3:#6f6f6c;
  --amber:#e8a33d; --amber2:#f3c26b; --teal:#5dcaa5; --red:#e2635f;
  --blue:#6aa9e0; --purple:#a99ce8; --pink:#dd8fb0; --green:#8fc98a;
  --serif:"Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 520px at 12% -8%, #1b1e26 0%, transparent 62%),
    radial-gradient(800px 460px at 96% -4%, #171a20 0%, transparent 58%),
    var(--bg);
  color:var(--tx);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  min-height:100vh;
}
a{color:var(--amber);text-decoration:none}
header.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:rgba(10,11,14,.86);border-bottom:1px solid var(--line)}
.top .in{max-width:1320px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--serif);font-size:18px;letter-spacing:.16em;color:var(--amber2)}
.brand span{font-size:10.5px;color:var(--tx3);letter-spacing:.22em;text-transform:uppercase}
.spacer{flex:1}
.btn{border:1px solid var(--line2);background:var(--panel);color:var(--tx2);
  padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12.5px;transition:.15s}
.btn:hover{border-color:var(--amber);color:var(--amber2)}
.btn.primary{background:linear-gradient(180deg,#f0b455,#dd9330);color:#20180a;border:none;font-weight:600}
.btn.primary:hover{filter:brightness(1.08);color:#20180a}
.btn.ghost{background:transparent}
main{max-width:1320px;margin:0 auto;padding:18px 20px 70px}

/* ---------- input ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.form{padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10.5px;color:var(--tx3);letter-spacing:.1em}
.field input,.field select{background:var(--bg2);border:1px solid var(--line2);color:var(--tx);
  padding:7px 9px;border-radius:7px;font-size:13.5px;font-family:inherit;width:100%}
.field input:focus,.field select:focus{outline:none;border-color:var(--amber)}
.form-actions{display:flex;align-items:flex-end}
.toggles{display:flex;flex-wrap:wrap;gap:14px;padding:0 16px 14px;font-size:12px;color:var(--tx2)}
.toggles label{display:flex;align-items:center;gap:5px;cursor:pointer}
.toggles input{accent-color:var(--amber)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;margin:16px 0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:8px 14px;color:var(--tx3);cursor:pointer;border-bottom:2px solid transparent;font-size:13px;white-space:nowrap}
.tab.on{color:var(--amber2);border-bottom-color:var(--amber)}
.tab:hover{color:var(--tx)}
.view{display:none}
.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ---------- section ---------- */
h2.sec{font-family:var(--serif);font-size:15px;letter-spacing:.14em;color:var(--amber2);
  font-weight:500;margin:22px 0 10px;display:flex;align-items:center;gap:9px}
h2.sec:before{content:"";width:3px;height:13px;background:var(--amber);border-radius:2px}
h2.sec small{font-family:inherit;font-size:10.5px;color:var(--tx3);letter-spacing:.06em;font-weight:400}

/* ---------- bazi table (professional) ---------- */
.bz{width:100%;border-collapse:collapse;table-layout:fixed;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bz th,.bz td{border:1px solid var(--line);padding:5px 7px;text-align:center;vertical-align:middle}
.bz thead th{background:var(--panel2);color:var(--tx3);font-size:11px;font-weight:500;letter-spacing:.14em}
.bz tbody th{width:56px;background:#1a1c24;color:var(--tx3);font-size:11px;font-weight:500;letter-spacing:.06em}
.bz td{font-size:12.5px;color:var(--tx2);line-height:1.45}
.bz .gz{font-family:var(--serif);font-size:31px;line-height:1.15;letter-spacing:.02em}
.bz tr.gzrow td{background:#14161c;padding:6px 4px}
.bz td.daycol{background:rgba(232,163,61,.055)}
.bz .sub{display:block;font-size:11px;color:var(--tx3)}
.bz .ssline{display:block;font-size:11.5px;color:var(--tx2)}
.wx-木{color:#7fc98a}.wx-火{color:#e2635f}.wx-土{color:#d3b06a}.wx-金{color:#cfd4dc}.wx-水{color:#6aa9e0}
.tag{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:3px;margin:1px 1px;
  background:#232732;color:var(--tx2)}
.tag.ji{background:#24352b;color:#8fd8b4}
.tag.xiong{background:#3a2224;color:#ee9d99}
.tag.zhong{background:#2a2b33;color:#a9a8a4}

/* ---------- luck strip ---------- */
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}
.lk{flex:0 0 84px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:7px 6px;text-align:center;cursor:pointer;transition:.15s}
.lk:hover{border-color:var(--line2)}
.lk.on{border-color:var(--amber);background:#221f18;box-shadow:0 0 0 1px rgba(232,163,61,.25)}
.lk .gz{font-family:var(--serif);font-size:19px;color:var(--tx)}
.lk .ss{font-size:10.5px;color:var(--tx3);margin-top:1px}
.lk .yr{font-size:10px;color:#4f4f4c}
.lk.cur .gz{color:var(--amber2)}
.strip.yr .lk{flex:0 0 74px;padding:5px 4px}
.strip.yr .lk .gz{font-size:15px}

/* ---------- ziwei board ---------- */
.board{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,minmax(150px,auto));
  gap:5px;background:#101218;padding:5px;border:1px solid var(--line);border-radius:10px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 7px 4px;
  position:relative;font-size:11.5px;overflow:hidden;display:flex;flex-direction:column;min-height:150px}
.cell>*{position:relative;z-index:1}
.cell.san{border-color:#3a3222}
.cell .hd{display:flex;align-items:baseline;gap:4px;font-size:11px;color:var(--tx3);margin-bottom:3px}
.cell .hd b{font-family:var(--serif);font-size:13px;color:var(--amber);font-weight:500;letter-spacing:.04em}
.cell .hd .gzc{margin-left:auto;font-family:var(--serif);font-size:11px;color:#5c5f6b}
.cell .bh{position:absolute;right:6px;bottom:1px;font-family:var(--serif);font-size:19px;color:#1e222a;z-index:0}
.maj{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:2px}
.maj i{font-style:normal;font-size:13.5px;font-weight:600;color:var(--tx);letter-spacing:.02em}
.maj i .b{font-size:9px;color:var(--tx3);margin-left:1px;vertical-align:super}
.min{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:2px}
.min i{font-style:normal;font-size:11.5px;color:var(--teal)}
.min i.bad{color:var(--red)}
.adj{display:flex;flex-wrap:wrap;gap:2px 4px;font-size:10px;color:#797c86;line-height:1.5}
.adj span{white-space:nowrap}
.gods{margin-top:auto;display:flex;gap:5px;font-size:9.5px;color:#565a65;flex-wrap:wrap}
.gods b{font-weight:400;color:#6b6f7b}
.hua{font-size:9px;padding:0 3px;border-radius:2px;margin-left:1px;font-weight:700;vertical-align:super}
.hua禄{background:#2c4a3c;color:#8fe0bb}.hua权{background:#3a3320;color:#f3c26b}
.hua科{background:#26364a;color:#8fc0e8}.hua忌{background:#4a2a2a;color:#f09b98}
.center{grid-column:2 / span 2;grid-row:2 / span 2;background:linear-gradient(160deg,#1a1d25,#13151a);
  border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:0;overflow:hidden}
.center h3{margin:0 0 4px;font-family:var(--serif);font-size:15px;color:var(--amber2);letter-spacing:.14em;font-weight:500}
.center .r{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx3);
  border-bottom:1px dotted #24272f;padding:3px 0;line-height:1.5}
.center .r b{color:var(--tx);font-weight:500;font-family:inherit}
.center .r b.gz{font-family:var(--serif);font-size:13px;letter-spacing:.05em;color:var(--amber2)}
.legend{font-size:11px;color:var(--tx3);margin-top:8px;display:flex;flex-wrap:wrap;gap:10px}

/* ---------- score ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.card h4{margin:0 0 7px;font-size:11px;color:var(--tx3);font-weight:500;letter-spacing:.12em}
.big{font-family:var(--serif);font-size:38px;line-height:1;color:var(--amber2)}
.big small{font-size:13px;color:var(--tx3);margin-left:3px;font-family:inherit}
.bar{height:6px;background:#21242c;border-radius:5px;overflow:hidden;margin:5px 0 1px}
.bar i{display:block;height:100%;border-radius:5px}
.dimrow{display:flex;align-items:center;gap:9px;font-size:12.5px;margin:6px 0}
.dimrow .nm{width:82px;color:var(--tx2);flex:none}
.dimrow .bar{flex:1;margin:0}
.dimrow .vl{width:34px;text-align:right;color:var(--tx);font-variant-numeric:tabular-nums}

/* ---------- table ---------- */
table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
.dt th,.dt td{padding:6px 8px;text-align:left;border-bottom:1px solid #21242c}
.dt th{color:var(--tx3);font-weight:500;font-size:11px;letter-spacing:.07em;white-space:nowrap}
.dt tbody tr:hover{background:#1b1e26}
.dt td.num{font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-block;padding:1px 7px;border-radius:12px;font-size:11px}
.p-hi{background:#22392c;color:#84dcae}.p-mid{background:#3a3320;color:#ecc47e}.p-low{background:#3c2427;color:#ef9d99}
.note{font-size:12px;color:var(--tx3);line-height:1.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ev-row{display:grid;grid-template-columns:80px 108px 1fr 150px 30px;gap:7px;align-items:center;margin-bottom:7px}
.ev-row input,.ev-row select{background:var(--bg2);border:1px solid var(--line2);color:var(--tx);
  padding:5px 7px;border-radius:6px;font-size:12.5px;width:100%;font-family:inherit}
.ev-row input[type=range]{padding:0}
.del{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:15px}
.del:hover{color:var(--red)}
.kv{display:grid;grid-template-columns:84px 1fr;gap:3px 10px;font-size:12.5px}
.kv dt{color:var(--tx3)}
.kv dd{margin:0;color:var(--tx)}
.foot{max-width:1320px;margin:0 auto;padding:0 20px 50px;font-size:11px;color:#55554f;line-height:1.8}
@media(max-width:900px){
  .two{grid-template-columns:1fr}
  .bz .gz{font-size:24px}
  .board{grid-template-rows:repeat(4,minmax(136px,auto))}
  .cell{font-size:10.5px}
  .ev-row{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><b>命理引擎</b><span>BaZi × Zi Wei</span></div>
  <div class="spacer"></div>
  <a class="btn ghost" href="https://github.com/WEIWEI0614/bazi-ziwei" target="_blank" rel="noopener">GitHub</a>
  <button class="btn" id="langBtn">EN</button>
</div></header>

<main>
  <div class="panel">
    <div class="form">
      <div class="field"><label id="l-name">姓名 / Name</label><input id="f-name" placeholder="—"></div>
      <div class="field"><label id="l-gender">性别 / Gender</label>
        <select id="f-gender"><option value="male">男 / Male</option><option value="female">女 / Female</option></select></div>
      <div class="field"><label id="l-cal">历法 / Calendar</label>
        <select id="f-cal"><option value="solar">公历 Gregorian</option><option value="lunar">农历 Lunar</option></select></div>
      <div class="field" id="wrap-solar"><label id="l-date">生日 / Date</label><input id="f-date" type="date" value="1993-06-14"></div>
      <div class="field" id="wrap-lunar" style="display:none"><label>农历 / Lunar</label><input id="f-lunar" placeholder="1993-4-25 / 1993-闰4-25"></div>
      <div class="field"><label id="l-time">时间 / Time</label><input id="f-time" type="time" value="17:31"></div>
      <div class="field"><label id="l-lon">经度 / Longitude</label>
        <select id="f-city">
          <option value="116.40">北京 116.40</option><option value="121.47">上海 121.47</option>
          <option value="113.26">广州 113.26</option><option value="114.06">深圳 114.06</option>
          <option value="104.07">成都 104.07</option><option value="108.95">西安 108.95</option>
          <option value="126.53">哈尔滨 126.53</option><option value="87.62">乌鲁木齐 87.62</option>
          <option value="114.17">香港 114.17</option><option value="121.52">台北 121.52</option>
          <option value="103.85">新加坡 103.85</option><option value="custom">自定义…</option>
        </select></div>
      <div class="field"><label id="l-customlon">经度值 / °E</label><input id="f-lon" type="number" step="0.01" value="116.40"></div>
      <div class="field form-actions"><button class="btn primary" id="go" style="width:100%">排盘 · Cast</button></div>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="f-truesolar" checked> <span id="l-ts">真太阳时</span></label>
      <label><input type="checkbox" id="f-zistart" checked> <span id="l-zs">子初换日</span></label>
      <label><input type="checkbox" id="f-feixing"> <span id="l-fx">飞星派四化</span></label>
      <label><input type="checkbox" id="f-leapsplit" checked> <span id="l-lp">闰月分半</span></label>
      <label><span id="l-fy">流年</span> <input id="f-focus" type="number" value="2026"
        style="width:70px;background:var(--bg2);border:1px solid var(--line2);color:var(--tx);border-radius:5px;padding:1px 5px"></label>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <section class="view on" id="v-chart">
    <h2 class="sec" id="h-bazi">四柱八字 <small>Four Pillars</small></h2>
    <table class="bz" id="bzTable"></table>

    <h2 class="sec" id="h-dayun">大运 <small>Ten-year cycles</small></h2>
    <div class="strip" id="dayunStrip"></div>

    <h2 class="sec" id="h-liunian">流年 <small>Annual</small></h2>
    <div class="strip yr" id="liunianStrip"></div>
    <p class="note" id="liunianNote" style="margin-top:6px"></p>

    <h2 class="sec" id="h-zw">紫微斗数命盘 <small>Zi Wei Dou Shu</small></h2>
    <div class="board" id="board"></div>
    <div class="legend" id="zwLegend"></div>
    <div class="card" id="palaceDetail" style="margin-top:10px"></div>
  </section>

  <section class="view" id="v-score">
    <div class="cards" style="grid-template-columns:minmax(250px,1fr) minmax(300px,1.5fr)">
      <div class="card"><h4 id="h-overall">综合格局</h4>
        <div><span class="big" id="overall">—</span><small id="tier"></small></div>
        <div class="note" id="tierNote" style="margin-top:7px"></div></div>
      <div class="card"><h4 id="h-radar">六维</h4><svg id="radar" viewBox="0 0 320 300" style="width:100%;max-width:400px"></svg></div>
    </div>
    <h2 class="sec" id="h-dims">评分拆解</h2><div class="card" id="dims"></div>
    <h2 class="sec" id="h-areas">六领域</h2><div class="card" id="areas"></div>
    <h2 class="sec" id="h-read">命局解读</h2>
    <div class="two">
      <div class="card"><h4 id="h-bzread">八字</h4><dl class="kv" id="bzread"></dl></div>
      <div class="card"><h4 id="h-zwread">紫微</h4><dl class="kv" id="zwread"></dl></div>
    </div>
    <h2 class="sec" id="h-school">流派视角</h2><div class="card" id="schoolbox"></div>
    <h2 class="sec" id="h-ss">神煞 · 刑冲合害</h2><div class="card" id="ssbox"></div>
  </section>

  <section class="view" id="v-year">
    <h2 class="sec" id="h-luck">大运</h2>
    <div class="card" style="overflow-x:auto"><table class="dt" id="cycTable"></table></div>
    <h2 class="sec" id="h-timeline">流年走势</h2>
    <div class="card"><svg id="yearChart" viewBox="0 0 900 210" style="width:100%"></svg></div>
    <div class="card" style="overflow-x:auto;margin-top:10px"><table class="dt" id="yearTable"></table></div>
  </section>

  <section class="view" id="v-month">
    <h2 class="sec" id="h-month">流月</h2>
    <div class="card"><svg id="monthChart" viewBox="0 0 900 190" style="width:100%"></svg></div>
    <div class="card" style="overflow-x:auto;margin-top:10px"><table class="dt" id="monthTable"></table></div>
  </section>

  <section class="view" id="v-event">
    <h2 class="sec" id="h-event">经历对照</h2>
    <p class="note" id="evHint" style="margin:0 0 10px"></p>
    <div class="card">
      <div class="ev-row" style="font-size:10.5px;color:var(--tx3)" id="evHead"></div>
      <div id="evList"></div>
      <button class="btn" id="addEv" style="margin-top:5px">+ 添加事件</button>
      <button class="btn primary" id="runEv" style="margin-top:5px">开始对照 · Calibrate</button>
    </div>
    <div id="evOut"></div>
  </section>

  <section class="view" id="v-method">
    <h2 class="sec" id="h-method">方法与校验</h2><div class="card" id="methodBox"></div>
  </section>
</main>
<footer class="foot" id="foot"></footer>

<script>
/* 出错就说出来，而不是留一张白页 */
window.__mlErr = function (msg) {
  if (document.getElementById("ml-err")) return;
  var d = document.createElement("div");
  d.id = "ml-err";
  d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:9999;background:#3a2224;color:#f0b3ae;padding:9px 16px;font:13px/1.6 -apple-system,system-ui;display:flex;gap:12px;align-items:center;border-bottom:1px solid #5a3336";
  d.innerHTML = '<span>脚本出错：' + msg + '</span>' +
    '<button onclick="location.replace(location.pathname+'?v='+Date.now())" style="margin-left:auto;background:#e8a33d;color:#20180a;border:0;padding:3px 12px;border-radius:5px;cursor:pointer;font:12px system-ui">强制重新加载</button>';
  document.body.appendChild(d);
};
window.addEventListener("error", function (e) {
  var f = e.filename ? " @ " + e.filename.split("/").pop() : "";
  window.__mlErr((e.message || "资源加载失败") + f);
}, true);
</script>
<noscript><div style="padding:36px;font:14px/1.9 system-ui;color:#e9e6df">这个页面需要启用 JavaScript 才能排盘。</div></noscript>
<script src="data.js?v=3"></script>
<script src="engine.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
